openapi: 3.0.3
info:
  title: BE WISE School API
  version: 0.7.0
  description: API REST multi-tenant de BE WISE School. En développement local, utilisez
    X-Tenant-Slug si nécessaire.
paths:
  /api/academics/bootstrap/:
    post:
      operationId: academics_bootstrap_create
      tags:
      - Academics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
      parameters:
      - name: X-Tenant-Slug
        in: header
        required: false
        description: Développement local uniquement. Slug de l'établissement, par
          exemple `saint-joseph`. En production, le tenant est normalement résolu
          depuis le sous-domaine.
        schema:
          type: string
          example: saint-joseph
