services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [school_internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - school_media:/app/media
      - school_static:/app/staticfiles
    expose: ["8000"]
    networks: [school_internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8088}:80"
    networks: [school_internal]

volumes:
  postgres_data:
  school_media:
  school_static:

networks:
  school_internal:
    driver: bridge
